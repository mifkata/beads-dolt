services:
  dolt:
    container_name: beads_dolt
    build: .
    user: root
    ports:
      - "3307:3307"
    volumes:
      - ./data:/data
      - .:/repo
      - .ssh:/home/dev/.ssh
      - ./bin/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./bin/sync.sh:/usr/local/bin/sync.sh:ro
    environment:
      - SYNC_INTERVAL=${SYNC_INTERVAL:-60}
